name: Run DB Migration 050

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pg
        run: npm install pg

      - name: Run migration
        run: |
          node -e "
          const { Pool } = require('pg');
          const fs = require('fs');

          const sql = fs.readFileSync('supabase/migrations/050_invite_accounts.sql', 'utf-8');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;

          async function main() {
            const hosts = [
              { host: 'db.rnqalafmuyrlfioqdore.supabase.co', port: 5432, user: 'postgres', label: 'Direct' },
              { host: 'aws-0-eu-central-1.pooler.supabase.com', port: 6543, user: 'postgres.rnqalafmuyrlfioqdore', label: 'Pooler eu-central-1' },
              { host: 'aws-0-eu-west-1.pooler.supabase.com', port: 6543, user: 'postgres.rnqalafmuyrlfioqdore', label: 'Pooler eu-west-1' },
              { host: 'aws-0-us-east-1.pooler.supabase.com', port: 6543, user: 'postgres.rnqalafmuyrlfioqdore', label: 'Pooler us-east-1' },
            ];

            const errors = [];

            for (const cfg of hosts) {
              try {
                console.log('Trying ' + cfg.label + '...');
                const pool = new Pool({
                  host: cfg.host,
                  port: cfg.port,
                  user: cfg.user,
                  password: key,
                  database: 'postgres',
                  ssl: { rejectUnauthorized: false },
                  max: 1,
                  connectionTimeoutMillis: 10000,
                });
                const client = await pool.connect();
                await client.query(sql);
                console.log('Migration applied via ' + cfg.label);
                client.release();
                await pool.end();
                process.exit(0);
              } catch (err) {
                errors.push(cfg.label + ': ' + err.message);
              }
            }

            console.error('All connections failed:');
            errors.forEach(e => console.error('  ' + e));
            process.exit(1);
          }

          main();
          "
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
