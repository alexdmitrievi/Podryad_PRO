name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    env:
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate SQL migrations
        run: |
          for f in ../supabase/migrations/*.sql; do
            echo "Checking $f..."
            head -1 "$f" | grep -qE '^(--|CREATE|ALTER|INSERT|DO|BEGIN|SET)' || (echo "ERROR: $f has invalid first line" && exit 1)
          done
          echo "All migrations validated"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_BOT_NAME: ${{ secrets.STAGING_BOT_NAME || 'test_bot' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY || 'placeholder' }}
          VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY || 'placeholder' }}
          CUSTOMER_JWT_SECRET: ${{ secrets.STAGING_CUSTOMER_JWT_SECRET || 'placeholder' }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: pwa/coverage/

  e2e-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run API e2e tests
        run: npm run test:e2e:api
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          NEXT_PUBLIC_BOT_NAME: ${{ secrets.STAGING_BOT_NAME || 'test_bot' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY || 'placeholder' }}
          VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY || 'placeholder' }}
          VAPID_SUBJECT: mailto:staging@podryadpro.ru
          CRON_SECRET: test-cron-secret-local
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_ALLOW_PROD: 1
          CUSTOMER_JWT_SECRET: ${{ secrets.STAGING_CUSTOMER_JWT_SECRET || 'placeholder' }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET || 'placeholder' }}
          ADMIN_PIN: ${{ secrets.STAGING_ADMIN_PIN || '2407' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-api
          path: pwa/playwright-report/

  e2e-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    needs: lint-build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser e2e tests
        run: npx playwright test --project='Mobile Chrome' --project='Desktop Chrome'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}
          NEXT_PUBLIC_BOT_NAME: ${{ secrets.STAGING_BOT_NAME || 'test_bot' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY || 'placeholder' }}
          VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY || 'placeholder' }}
          VAPID_SUBJECT: mailto:staging@podryadpro.ru
          CRON_SECRET: test-cron-secret-local
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          E2E_ALLOW_PROD: 1
          CUSTOMER_JWT_SECRET: ${{ secrets.STAGING_CUSTOMER_JWT_SECRET || 'placeholder' }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET || 'placeholder' }}
          ADMIN_PIN: ${{ secrets.STAGING_ADMIN_PIN || '2407' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-browser
          path: pwa/playwright-report/

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    needs: lint-build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli

      - name: Build the app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_BOT_NAME: ${{ secrets.STAGING_BOT_NAME || 'test_bot' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.STAGING_VAPID_PUBLIC_KEY || 'placeholder' }}
          VAPID_PRIVATE_KEY: ${{ secrets.STAGING_VAPID_PRIVATE_KEY || 'placeholder' }}
          CUSTOMER_JWT_SECRET: ${{ secrets.STAGING_CUSTOMER_JWT_SECRET || 'placeholder' }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET || 'placeholder' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

      - name: Start the app
        run: npx next start -p 3000 &

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000

      - name: Run Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: pwa/.lighthouseci/

  env-validation:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Validate environment variables
        run: npx tsx scripts/validate-env.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'placeholder' }}
          NEXT_PUBLIC_BOT_NAME: test_bot
          LANG: C.UTF-8

  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Scan for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          grep -rPn "(sk-[a-zA-Z0-9]{20,}|xox[baprs]-[a-zA-Z0-9-]+|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16}|eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,})" src/ lib/ || echo "No obvious secrets found"

  # Only run on push to main (not PR)
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint-build-test, e2e-api, e2e-browser, lighthouse]
    environment:
      name: production
      url: https://podryad.pro

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Vercel production deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Deployment status
        run: |
          echo "Production deployment triggered."
          echo "Monitor: https://vercel.com/dashboard"
